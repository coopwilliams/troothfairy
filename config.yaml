# Troothfairy configuration

# Path to the Obsidian vault (relative to repo root or absolute)
vault_path: ./orb-vault

# Number of recent completed jobs to show in the menu bar
max_recent_jobs: 5

# Status directory for inter-process communication
status_dir: /tmp/troothfairy-status

# Directories accessible to subagents.
# Each entry: "path access" where access is read | write | read-write
# Relative paths are resolved from the repo root.
dirs:
  - ./sourcing/tags read
  - /Users/cooperwilliams/Documents/02-books read
  - /Users/cooperwilliams/Documents/03-papers-essays read
  - ./_EXCERPTS write
